<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
    .wave-back { fill: none; stroke: #0284c7; stroke-width: 2; opacity: 0.3; }
    .wave-front { fill: none; stroke: #10b981; stroke-width: 3; filter: url(#glow); }
    .node-pulse { fill: #34d399; animation: pulse 3s infinite alternate; }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.5; }
      100% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #34d399); }
    }
    .flow-line {
      stroke: #38bdf8;
      stroke-width: 2;
      stroke-dasharray: 8 12;
      animation: flow 20s linear infinite;
    }
    @keyframes flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; letter-spacing: 1px; }
    .badge-bg { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 6px; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #38bdf8; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="12" fill="url(#bgGrad)"/>

  <!-- Dynamic Background Grid & Energy Flow (in background layer) -->
  <g opacity="0.6">
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line"/>

    <!-- Dynamic Flow Lines in BG -->
    <path d="M-50,250 Q 300,180 600,260 T 1250,200" class="wave-back"/>
    <path d="M-50,270 Q 350,140 700,280 T 1250,180" class="wave-front"/>
    <path d="M-50,210 Q 250,290 550,190 T 1250,240" class="flow-line"/>

    <!-- Animated Nodes along grid -->
    <circle cx="200" cy="225" r="6" class="node-pulse"/>
    <circle cx="550" cy="190" r="5" class="node-pulse" style="animation-delay: 1s;"/>
    <circle cx="850" cy="240" r="7" class="node-pulse" style="animation-delay: 2s;"/>
    <circle cx="1050" cy="195" r="5" class="node-pulse" style="animation-delay: 1.5s;"/>
  </g>

  <!-- Content Elements (Prominently in Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 50)">
      <rect class="badge-bg" width="310" height="30" x="0" y="0"/>
      <text x="15" y="19" class="badge-text">⚡ VPP &amp; GRID FLEXIBILITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text" filter="url(#glow)">Awesome Demand Response Management ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle-text">Curated SaaS Platforms, Virtual Power Plants (VPP) &amp; Open-Source Grid Orchestration Tools</text>

    <!-- Subtitle / Meta Tags -->
    <g transform="translate(0, 215)">
      <rect fill="#0f172a" opacity="0.8" rx="20" width="160" height="32" stroke="#334155"/>
      <text x="20" y="21" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">🔋 DERMS &amp; VPP</text>

      <rect x="175" fill="#0f172a" opacity="0.8" rx="20" width="175" height="32" stroke="#334155"/>
      <text x="195" y="21" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">🌐 Grid Flexibility</text>

      <rect x="365" fill="#0f172a" opacity="0.8" rx="20" width="180" height="32" stroke="#334155"/>
      <text x="385" y="21" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">💻 Open-Source EMS</text>
    </g>
  </g>
</svg>
